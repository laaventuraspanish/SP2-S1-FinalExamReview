<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Final - Español 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .btn-option { transition: all 0.2s; }
        .btn-option:active { transform: scale(0.98); }
        .verb-underline { text-decoration: underline; text-underline-offset: 4px; color: #4338ca; font-weight: 800; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-2xl text-center my-8">
        <h1 class="text-4xl font-bold text-indigo-700">¡Repaso Final!</h1>
        <p class="text-slate-600 mt-2">Spanish 2 Semester Practice</p>
    </header>

    <main id="app" class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 md:p-8 min-h-[400px] flex flex-col justify-center">
        <!-- Main Menu -->
        <div id="main-menu" class="space-y-4">
            <h2 class="text-xl font-semibold text-center mb-6">Elige un modo de práctica:</h2>
            <button onclick="startGame(1)" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 card text-left px-6">
                <span class="block">Modo 1: Identificar el Tiempo</span>
                <span class="text-xs font-normal opacity-90">Pool de 40 oraciones: Presente, Pretérito o Imperfecto.</span>
            </button>
            <button onclick="startGame(2)" class="w-full py-4 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 card text-left px-6">
                <span class="block">Modo 2: Traducción y Estructuras</span>
                <span class="text-xs font-normal opacity-90">Pool de 50+ oraciones: Variedad de temas y "It is allowed".</span>
            </button>
            <button onclick="startGame(3)" class="w-full py-4 bg-amber-600 text-white rounded-xl font-semibold hover:bg-amber-700 card text-left px-6">
                <span class="block">Modo 3: Comprensión de Lectura</span>
                <span class="text-xs font-normal opacity-90">Párrafos detallados de 3-4 oraciones. (7 por ronda)</span>
            </button>
        </div>

        <!-- Game Interface -->
        <div id="game-container" class="hidden flex flex-col h-full">
            <div class="flex justify-between items-center mb-4">
                <span id="progress" class="text-sm font-medium text-slate-500">Pregunta 1 de 10</span>
                <button onclick="showMenu()" class="text-sm text-red-500 hover:underline">Salir al Menú</button>
            </div>

            <div id="instruction-box" class="mb-4 p-3 bg-indigo-50 border-l-4 border-indigo-400 text-indigo-700 text-sm font-medium italic"></div>
            
            <div id="content-area" class="flex-grow flex flex-col justify-center items-center text-center"></div>

            <div id="feedback" class="mt-4 p-4 rounded-lg hidden text-center font-medium"></div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center space-y-6">
            <h2 class="text-3xl font-bold text-indigo-700">¡Buen trabajo!</h2>
            <p id="score-text" class="text-xl text-slate-700 font-medium"></p>
            <div class="flex flex-col space-y-3">
                <button id="replay-btn" class="py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700">Jugar otra vez</button>
                <button onclick="showMenu()" class="py-3 bg-slate-200 text-slate-700 rounded-lg font-semibold hover:bg-slate-300">Menú Principal</button>
            </div>
        </div>
    </main>

    <script>
        // --- DATA POOLS ---
        
        // POOL 1: 40 Sentences
        const identificationSentences = [
            { s: "Yo {v} pizza en el centro comercial.", t: "Presente", v: "como" },
            { s: "Ellos {v} con el reportero ayer.", t: "Pretérito", v: "hablaron" },
            { s: "Nosotros {v} al parque todos los sábados.", t: "Imperfecto", v: "íbamos" },
            { s: "Ella {v} con sus amigos en la calle.", t: "Imperfecto", v: "jugaba" },
            { s: "Tú {v} la tarea anoche.", t: "Pretérito", v: "hiciste" },
            { s: "Ustedes {v} muy amables con los vecinos.", t: "Presente", v: "son" },
            { s: "Mis padres {v} en una casa pequeña.", t: "Imperfecto", v: "vivían" },
            { s: "Yo {v} al cine el viernes pasado.", t: "Pretérito", v: "fui" },
            { s: "El reportero {v} la noticia ahora.", t: "Presente", v: "escribe" },
            { s: "Nosotros {v} la comida a los invitados.", t: "Presente", v: "servimos" },
            { s: "Él {v} una ensalada en el restaurante.", t: "Pretérito", v: "pidió" },
            { s: "Yo {v} mis llaves frecuentemente.", t: "Imperfecto", v: "perdía" },
            { s: "Usted {v} en la oficina del director.", t: "Presente", v: "trabaja" },
            { s: "Tú {v} la puerta con llave.", t: "Pretérito", v: "cerraste" },
            { s: "Ellas {v} mejores amigas en la escuela.", t: "Imperfecto", v: "eran" },
            { s: "Nosotros {v} la convivencia escolar.", t: "Presente", v: "hacemos" },
            { s: "Yo {v} muy tímido de niño.", t: "Imperfecto", v: "era" },
            { s: "Él {v} un video para el proyecto.", t: "Pretérito", v: "hizo" },
            { s: "Los estudiantes {v} la lección.", t: "Presente", v: "entienden" },
            { s: "Tú {v} mucho durante las vacaciones.", t: "Imperfecto", v: "dormías" },
            { s: "El gato {v} sobre el sofá toda la tarde.", t: "Imperfecto", v: "dormía" },
            { s: "Mañana yo {v} al médico para un chequeo.", t: "Presente", v: "voy" },
            { s: "Mis amigos {v} a la fiesta el sábado pasado.", t: "Pretérito", v: "vinieron" },
            { s: "Nosotros {v} en Boston hace diez años.", t: "Imperfecto", v: "vivíamos" },
            { s: "Ustedes {v} el examen en silencio ayer.", t: "Pretérito", v: "completaron" },
            { s: "Ella {v} un libro interesante ahora mismo.", t: "Presente", v: "lee" },
            { s: "Tú {v} muy alto cuando tenías cinco años.", t: "Imperfecto", v: "eras" },
            { s: "Yo {v} mi teléfono en el taxi anoche.", t: "Pretérito", v: "perdí" },
            { s: "Ellos {v} fútbol todos los domingos.", t: "Presente", v: "juegan" },
            { s: "Mi abuela {v} galletas deliciosas siempre.", t: "Imperfecto", v: "hacía" },
            { s: "Nosotros {v} un viaje a España el verano pasado.", t: "Pretérito", v: "hicimos" },
            { s: "Usted {v} español muy bien, señor.", t: "Presente", v: "habla" },
            { s: "Tú {v} a la escuela en autobús antes.", t: "Imperfecto", v: "ibas" },
            { s: "Yo {v} un regalo para mi madre ayer.", t: "Pretérito", v: "compré" },
            { s: "Los pájaros {v} todas las mañanas.", t: "Presente", v: "cantan" },
            { s: "Ella {v} mucho café el año pasado.", t: "Imperfecto", v: "bebía" },
            { s: "Nosotros {v} la verdad al director ayer.", t: "Pretérito", v: "dijimos" },
            { s: "Ustedes {v} ropa nueva para el baile.", t: "Presente", v: "buscan" },
            { s: "Yo {v} a nadar cada verano de niño.", t: "Imperfecto", v: "aprendía" },
            { s: "Tú {v} una canción muy bonita anoche.", t: "Pretérito", v: "cantaste" }
        ];

        // POOL 2: 50+ Translation Sentences
        const translationBase = [
            { s: "Yo como pizza en el centro comercial.", c: "I eat pizza at the mall." },
            { s: "Ellos hablaron con el reportero ayer.", c: "They spoke with the reporter yesterday." },
            { s: "Nosotros íbamos al parque todos los sábados.", c: "We used to go to the park every Saturday." },
            { s: "Ella jugaba con sus amigos en la calle.", c: "She used to play with her friends in the street." },
            { s: "Tú hiciste la tarea anoche.", c: "You did the homework last night." },
            { s: "Ustedes son muy amables con los vecinos.", c: "You all are very kind to the neighbors." },
            { s: "Mis padres vivían en una casa pequeña.", c: "My parents used to live in a small house." },
            { s: "Yo fui al cine el viernes pasado.", c: "I went to the cinema last Friday." },
            { s: "El reportero escribe la noticia ahora.", c: "The reporter writes the news now." },
            { s: "Nosotros servimos la comida a los invitados.", c: "We serve the food to the guests." },
            { s: "Él pidió una ensalada en el restaurante.", c: "He ordered a salad in the restaurant." },
            { s: "Yo perdía mis llaves frecuentemente.", c: "I used to lose my keys frequently." },
            { s: "Usted trabaja en la oficina del director.", c: "You work in the principal's office." },
            { s: "Tú cerraste la puerta con llave.", c: "You locked the door." },
            { s: "Ellas eran mejores amigas en la escuela.", c: "They were best friends in school." },
            { s: "Nosotros hacemos la convivencia escolar.", c: "We do the school social event." },
            { s: "Yo era muy tímido de niño.", c: "I was very shy as a child." },
            { s: "Él hizo un video para el proyecto.", c: "He made a video for the project." },
            { s: "Los estudiantes entienden la lección.", c: "The students understand the lesson." },
            { s: "Tú dormías mucho durante las vacaciones.", c: "You used to sleep a lot during the vacations." },
            { s: "El sol brilla mucho hoy.", c: "The sun shines a lot today." },
            { s: "Mi perro siempre corre tras la pelota.", c: "My dog always runs after the ball." },
            { s: "Me gusta mucho viajar en avión.", c: "I really like traveling by plane." },
            { s: "Nosotros compramos frutas en el mercado.", c: "We buy fruit at the market." },
            { s: "Ella tiene tres hermanos menores.", c: "She has three younger brothers." },
            { s: "El café está muy caliente todavía.", c: "The coffee is still very hot." },
            { s: "Tú nadas en la piscina olímpica.", c: "You swim in the Olympic pool." },
            { s: "Mi madre cocina una cena deliciosa.", c: "My mother cooks a delicious dinner." },
            { s: "Ellos estudian para el examen final.", c: "They study for the final exam." },
            { s: "Usted lee el periódico cada mañana.", c: "You read the newspaper every morning." },
            { s: "El coche rojo es muy rápido.", c: "The red car is very fast." },
            { s: "Nosotros visitamos a los abuelos.", c: "We visit the grandparents." },
            { s: "Yo escucho música en mi dormitorio.", c: "I listen to music in my bedroom." },
            { s: "La película empieza a las ocho.", c: "The movie starts at eight o'clock." },
            { s: "Tú buscas tus llaves en el bolso.", c: "You look for your keys in the bag." },
            { s: "Ella prefiere el helado de chocolate.", c: "She prefers chocolate ice cream." },
            { s: "Los niños juegan en el jardín.", c: "The children play in the garden." },
            { s: "Mi padre trabaja en un banco grande.", c: "My father works in a large bank." },
            { s: "El agua está muy fría en el invierno.", c: "The water is very cold in the winter." },
            { s: "Ustedes bailan muy bien juntos.", c: "You all dance very well together." },
            { s: "No se puede hablar en la biblioteca.", c: "It is not allowed to speak in the library." },
            { s: "Se puede jugar al fútbol aquí.", c: "It is allowed to play soccer here." },
            { s: "No se puede comer en el laboratorio.", c: "It is not allowed to eat in the lab." },
            { s: "Hay que hacer la tarea todos los días.", c: "One must do homework every day." },
            { s: "Hay que convivir en paz.", c: "One must coexist in peace." },
            { s: "Se puede usar el ascensor.", c: "It is allowed to use the elevator." },
            { s: "No se puede correr por los pasillos.", c: "It is not allowed to run through the hallways." },
            { s: "Hay que llegar a tiempo a clase.", c: "One must arrive to class on time." },
            { s: "Se puede traer agua a la reunión.", c: "It is allowed to bring water to the meeting." },
            { s: "No se puede fumar en el edificio.", c: "It is not allowed to smoke in the building." }
        ];

        const randomEnglishDistractors = [
            "The clouds are grey and it might rain soon.",
            "My favorite book is about space exploration.",
            "We need to buy more milk and eggs at the store.",
            "The technology has changed a lot in five years.",
            "She is studying architecture at the university.",
            "Swimming in the ocean is very relaxing.",
            "He wants to visit Japan next summer with his family.",
            "Computers are essential for modern office work.",
            "A healthy breakfast gives you energy for the day.",
            "The movie was longer than I expected.",
            "The garden looks beautiful with the new flowers.",
            "They decided to cancel the meeting until Monday.",
            "Learning a new language opens many doors.",
            "The train arrives at ten o'clock sharp.",
            "I usually take the bus to save money.",
            "The pizza was cold but still tasted okay.",
            "The scientist discovered a new species of fish.",
            "Football is the most popular sport in the world.",
            "Heavy traffic delayed my arrival at the office.",
            "The hotel has a wonderful view of the city.",
            "She forgot her umbrella and got very wet.",
            "The mountains are covered in deep snow.",
            "Please turn off the lights when you leave.",
            "He found an old coin under the sofa.",
            "The concert was moved to a larger venue.",
            "Walking every day is good for your heart.",
            "The library is open late on Tuesdays.",
            "I need a new pair of running shoes.",
            "The cake is baking in the oven now.",
            "A fast internet connection is necessary today.",
            "The red bike belongs to my neighbor.",
            "They are painting the school building white.",
            "The cat is hiding under the wooden table.",
            "Would you like a cup of green tea?"
        ];

        const readingPassages = [
            { 
                text: "En mi escuela, la convivencia es muy importante para todos. Cada lunes, los estudiantes y los maestros tienen una reunión larga. Hablamos de las reglas y de cómo mejorar el ambiente escolar.", 
                q: "¿Qué se discute en las reuniones de los lunes?", 
                options: ["Las reglas y el ambiente escolar.", "Los resultados de los deportes.", "La comida de la cafetería.", "Las vacaciones del próximo mes."], 
                correct: 0 
            },
            { 
                text: "Ayer fui al centro comercial con mi hermano mayor. Él buscaba zapatos nuevos porque los suyos estaban muy rotos. Caminamos por tres horas pero al final no encontramos nada interesante.", 
                q: "¿Qué resultado tuvo la búsqueda de zapatos?", 
                options: ["No encontraron nada.", "Compraron tres pares.", "Encontraron zapatos rojos.", "Perdieron el dinero."], 
                correct: 0 
            },
            { 
                text: "Cuando yo era niño, vivía en una granja muy grande con muchos animales. Mi actividad favorita era ayudar a mi abuelo a alimentar a las vacas y a los cerdos. Siempre era un trabajo muy divertido y tranquilo.", 
                q: "¿Qué hacía el narrador en la granja?", 
                options: ["Ayudaba a alimentar animales.", "Jugaba videojuegos en casa.", "Corría por la ciudad.", "Limpiaba la casa de su abuela."], 
                correct: 0 
            },
            { 
                text: "El reportero entrevistó a muchos vecinos hoy por la mañana. Quería saber su opinión sobre la nueva noticia de la calle principal. La gente estaba muy emocionada por los cambios en el barrio.", 
                q: "¿Sobre qué quería saber el reportero?", 
                options: ["La noticia de la calle principal.", "La receta de una ensalada.", "El horario de los trenes.", "La vida de los maestros."], 
                correct: 0 
            },
            { 
                text: "Mañana tengo muchas ganas de ir a la playa con mis primos. El clima dice que va a hacer mucho calor y sol. Queremos nadar en el mar y jugar en la arena todo el día.", 
                q: "¿Por qué quieren ir a la playa?", 
                options: ["Porque va a hacer calor.", "Porque tienen que estudiar.", "Porque el mar está frío.", "Porque no tienen coche."], 
                correct: 0 
            },
            { 
                text: "No se puede usar el celular en la clase de español. El profesor explica la gramática y es necesario prestar mucha atención. Si usas el teléfono, el profesor se enoja mucho.", 
                q: "¿Qué sucede si usas el teléfono?", 
                options: ["El profesor se enoja.", "Recibes una buena nota.", "La clase termina temprano.", "Puedes escuchar música."], 
                correct: 0 
            },
            { 
                text: "Mi hermana prefiere el helado de fresa, pero yo siempre pido el de chocolate. Fuimos a la heladería ayer después de la escuela. El camarero fue muy amable y nos sirvió rápido.", 
                q: "¿Qué helado prefiere el narrador?", 
                options: ["Chocolate.", "Fresa.", "Vainilla.", "No le gusta el helado."], 
                correct: 0 
            }
        ];

        // --- GAME LOGIC ---
        let currentMode = 0;
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let attempts = 0;

        function showMenu() {
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('feedback').classList.add('hidden');
        }

        function startGame(mode) {
            currentMode = mode;
            currentIndex = 0;
            score = 0;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            
            if (mode === 1) {
                document.getElementById('instruction-box').innerText = "Identifica si el verbo subrayado es Presente, Pretérito o Imperfecto.";
                // Randomize question pool
                currentQuestions = shuffleArray([...identificationSentences]).slice(0, 10);
            } else if (mode === 2) {
                document.getElementById('instruction-box').innerText = "Elige la traducción correcta al inglés.";
                // Randomize pool of 10 from the translation base
                const pool = shuffleArray([...translationBase]).slice(0, 10);
                currentQuestions = pool.map(q => {
                    // Randomize unique distractors for each question
                    let distractors = shuffleArray([...randomEnglishDistractors]).slice(0, 3);
                    return { s: q.s, correct: q.c, options: shuffleArray([q.c, ...distractors]) };
                });
            } else if (mode === 3) {
                document.getElementById('instruction-box').innerText = "Lee el párrafo y responde la pregunta.";
                // Shuffle and take 7 passages
                currentQuestions = shuffleArray([...readingPassages]).slice(0, 7).map(q => {
                    // Store the correct answer string before shuffling options
                    const correctStr = q.options[q.correct];
                    const shuffledOpts = shuffleArray([...q.options]);
                    const newCorrectIndex = shuffledOpts.indexOf(correctStr);
                    return { ...q, options: shuffledOpts, correct: newCorrectIndex };
                });
            }
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            const area = document.getElementById('content-area');
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('progress').innerText = `Pregunta ${currentIndex + 1} de ${currentQuestions.length}`;
            attempts = 0;

            let html = '';
            if (currentMode === 1) {
                const sentence = q.s.replace("{v}", `<span class="verb-underline">${q.v}</span>`);
                // Standardize order of tenses for identification mode
                const tenses = ['Presente', 'Pretérito', 'Imperfecto'];
                html = `<p class="text-2xl font-bold mb-8">"${sentence}"</p>
                    <div class="grid gap-3 w-full max-w-xs">
                        ${tenses.map(t => `<button onclick="checkAnswer('${t}')" class="btn-option py-3 bg-slate-100 border-2 rounded-xl font-medium hover:bg-indigo-50">${t}</button>`).join('')}
                    </div>`;
            } else {
                const isReading = currentMode === 3;
                html = `${isReading ? `<div class="bg-amber-50 p-5 rounded-xl border border-amber-200 mb-6 text-left"><p class="text-lg text-slate-800">${q.text}</p></div>` : ''}
                    <p class="text-xl font-bold mb-6 text-indigo-900">${isReading ? q.q : `"${q.s}"`}</p>
                    <div class="grid gap-3 w-full">
                        ${q.options.map((opt, idx) => `<button onclick="checkAnswer(${isReading ? idx : `'${opt.replace(/'/g, "\\'")}'`})" class="btn-option py-3 px-6 bg-slate-50 border-2 rounded-xl text-left hover:bg-indigo-50">${opt}</button>`).join('')}
                    </div>`;
            }
            area.innerHTML = html;
        }

        function checkAnswer(answer) {
            const q = currentQuestions[currentIndex];
            const feedback = document.getElementById('feedback');
            let isCorrect = (currentMode === 1) ? (answer === q.t) : (currentMode === 2 ? answer === q.correct : answer === q.correct);

            if (isCorrect) {
                if (attempts === 0) score++;
                feedback.innerText = "¡Muy bien!";
                feedback.className = "mt-4 p-4 rounded-lg bg-green-100 text-green-700 block text-center font-bold";
                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < currentQuestions.length) renderQuestion();
                    else showResults();
                }, 800);
            } else {
                attempts++;
                feedback.innerText = "Sigue intentando...";
                feedback.className = "mt-4 p-4 rounded-lg bg-red-100 text-red-700 block text-center font-bold";
            }
        }

        function showResults() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = `Tu puntuación final: ${score} / ${currentQuestions.length}`;
            document.getElementById('replay-btn').onclick = () => startGame(currentMode);
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
    </script>
</body>
</html>
